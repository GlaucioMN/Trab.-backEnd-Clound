<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CadastroEE - Produtos cadastrados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <header class="mb-4">
    <h1 class="h2">Produtos cadastrados</h1>
    <p class="text-body-secondary mb-0">Consulte e mantenha os itens da loja.</p>
  </header>
  <div class="alert alert-success" role="alert">Listagem carregada com sucesso.</div>
  <a class="btn btn-primary m-2 ms-0" href="preview-formulario.html">Incluir produto</a>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead class="table-dark">
      <tr><th>ID</th><th>Nome</th><th class="text-end">Quantidade</th><th class="text-end">Preço de venda</th><th class="text-center">Ações</th></tr>
      </thead>
      <tbody>
      <tr><td>1</td><td>Café 500 g</td><td class="text-end">25</td><td class="text-end">R$ 18,90</td><td class="text-center"><button class="btn btn-primary btn-sm">Alterar</button> <button class="btn btn-danger btn-sm">Excluir</button></td></tr>
      <tr><td>2</td><td>Leite integral 1 L</td><td class="text-end">40</td><td class="text-end">R$ 6,75</td><td class="text-center"><button class="btn btn-primary btn-sm">Alterar</button> <button class="btn btn-danger btn-sm">Excluir</button></td></tr>
      <tr><td>3</td><td>Arroz 5 kg</td><td class="text-end">18</td><td class="text-end">R$ 31,50</td><td class="text-center"><button class="btn btn-primary btn-sm">Alterar</button> <button class="btn btn-danger btn-sm">Excluir</button></td></tr>
      <tr><td>4</td><td>Feijão 1 kg</td><td class="text-end">30</td><td class="text-end">R$ 9,80</td><td class="text-center"><button class="btn btn-primary btn-sm">Alterar</button> <button class="btn btn-danger btn-sm">Excluir</button></td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
