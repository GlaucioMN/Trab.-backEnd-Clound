<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CadastroEE - Incluir produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <header class="mb-4"><h1 class="h2">Incluir produto</h1><p class="text-body-secondary mb-0">Preencha os dados e confirme a operação.</p></header>
  <form class="form">
    <div class="mb-3"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" value="Açúcar 1 kg"></div>
    <div class="mb-3"><label class="form-label" for="quantidade">Quantidade</label><input class="form-control" id="quantidade" type="number" value="20"></div>
    <div class="mb-3"><label class="form-label" for="preco">Preço de venda</label><input class="form-control" id="preco" type="number" value="5.90"></div>
    <button class="btn btn-primary" type="button">Incluir produto</button>
    <a class="btn btn-outline-secondary" href="preview-lista.html">Cancelar</a>
  </form>
</body>
</html>
